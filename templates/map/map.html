<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Tijuana - Modo Interactivo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        destello: { dark: '#0f172a', amber: '#f59e0b', blue: '#1e3a8a' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; background-color: #e5e7eb; }
        
        .custom-dim-tiles .leaflet-tile {
            filter: brightness(0.90) contrast(1.1) sepia(0.1);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        .leaflet-control-zoom a {
            background-color: #0f172a !important;
            color: #f59e0b !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            width: 44px !important;
            height: 44px !important;
            line-height: 44px !important;
            font-size: 18px !important;
            border-radius: 10px !important;
            margin-bottom: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .leaflet-control-zoom a:hover {
            background-color: #1e3a8a !important;
            color: #fff !important;
            transform: translateY(-1px);
        }
        .leaflet-bar { border: none !important; box-shadow: none !important; }
        
        .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.7) !important;
            color: #64748b !important;
            border-top-right-radius: 5px;
            font-size: 10px;
        }

        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast-exit { transform: translateY(0); opacity: 1; }
        .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s ease-in; }

        .leaflet-popup-content-wrapper {
            background-color: rgba(15, 23, 42, 0.95);
            color: white;
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 0.75rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .leaflet-popup-tip { 
            background-color: rgba(15, 23, 42, 0.95); 
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-top: none;
            border-left: none;
        }
        .leaflet-popup-close-button { display: none; }
    </style>
</head>
<body class="bg-destello-dark">

    <!-- NAVBAR -->
    <nav class="absolute top-0 left-0 w-full z-[1000] bg-gradient-to-b from-slate-900/60 to-transparent pt-4 pb-12 px-4 pointer-events-none">
        <div class="flex justify-between items-start pointer-events-auto">
            <!-- Píldora de Estado -->
            <div class="flex items-center gap-3 bg-slate-900/90 backdrop-blur-md p-2 pr-5 rounded-full border border-white/10 shadow-xl transform transition hover:scale-105 cursor-default">
                <div class="w-9 h-9 rounded-full bg-destello-blue/20 flex items-center justify-center border border-destello-blue/40">
                    <div class="w-2.5 h-2.5 rounded-full bg-destello-amber animate-pulse shadow-[0_0_8px_rgba(245,158,11,0.8)]"></div>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-white leading-none tracking-tight">Monitor Tijuana</h1>
                    <div class="flex items-center gap-1.5 mt-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        <p class="text-[10px] text-slate-300 font-medium leading-none">Sistema Online</p>
                    </div>
                </div>
            </div>
            
            <!-- BOTÓN REGRESAR (Con redirección agregada) -->
            <button onclick="window.location.href='/'" class="bg-white text-slate-700 border border-slate-200 w-10 h-10 rounded-full flex items-center justify-center hover:bg-destello-amber hover:text-white hover:border-destello-amber transition-all shadow-lg group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-0.5 transition-transform"><path d="m15 18-6-6 6-6"/></svg>
            </button>
        </div>
    </nav>

    <!-- PANEL LATERAL -->
    <div class="absolute top-24 left-4 z-[999] w-80 max-h-[calc(100vh-8rem)] flex flex-col gap-2 pointer-events-none hidden md:flex transition-all duration-500" id="floating-panel">
        <div class="pointer-events-auto bg-slate-900/95 backdrop-blur-md rounded-xl border border-white/10 shadow-2xl overflow-hidden flex flex-col">
            <div class="p-4 border-b border-white/5 flex justify-between items-center bg-slate-950/30">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Ubicaciones Guardadas</h2>
                <div class="w-2 h-2 rounded-full bg-destello-amber/50 animate-pulse"></div>
            </div>
            
            <div id="locations-list" class="overflow-y-auto max-h-[60vh] custom-scrollbar p-2 space-y-1">
                <div id="dynamic-list-content">
                    <div id="empty-state" class="p-4 text-center text-slate-500 text-xs italic">
                        No hay ubicaciones guardadas aún.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[2000] bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl border border-white/10 flex items-center gap-3 transition-all duration-300 translate-y-20 opacity-0 pointer-events-none">
        <div id="toast-icon"></div>
        <span id="toast-message" class="text-sm font-medium"></span>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        lucide.createIcons();

        const tijuanaCoords = [32.5149, -117.0382];
        const map = L.map('map', { 
            zoomControl: false, 
            attributionControl: true 
        }).setView(tijuanaCoords, 13);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO &copy; OpenStreetMap',
            maxZoom: 20,
            className: 'custom-dim-tiles'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);
        map.attributionControl.setPosition('bottomleft');

        const pendingIconHtml = `<div class="relative flex items-center justify-center w-8 h-8"><div class="w-4 h-4 bg-slate-400 rounded-full border-2 border-white shadow-lg"></div></div>`;
        const savedIconHtml = `<div class="relative flex items-center justify-center w-8 h-8"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-destello-amber opacity-50"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-destello-amber border-2 border-white shadow-md"></span></div>`;
        const loadingIconHtml = `<div class="relative flex items-center justify-center w-8 h-8"><div class="w-5 h-5 border-2 border-slate-300 border-t-destello-amber rounded-full animate-spin"></div></div>`;

        function createCustomIcon(html) {
            return L.divIcon({ className: 'custom-marker', html: html, iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -10] });
        }

        let tempMarker = null;

        map.on('click', function(e) {
            if (tempMarker) map.removeLayer(tempMarker);

            const { lat, lng } = e.latlng;
            tempMarker = L.marker([lat, lng], { icon: createCustomIcon(pendingIconHtml) }).addTo(map);

            const container = document.createElement('div');
            container.className = "text-center p-1 w-48";

            const title = document.createElement('h3');
            title.className = "text-sm font-bold text-slate-200 mb-3";
            title.innerText = "¿Guardar ubicación?";
            
            const btnGroup = document.createElement('div');
            btnGroup.className = "flex gap-2 justify-center";

            const btnCancel = document.createElement('button');
            btnCancel.className = "flex-1 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs text-white transition";
            btnCancel.innerText = "Cancelar"; 
            btnCancel.onclick = function() {
                map.closePopup();
                if (tempMarker) map.removeLayer(tempMarker);
            };

            const btnConfirm = document.createElement('button');
            btnConfirm.className = "flex-1 px-3 py-1.5 bg-destello-amber hover:bg-amber-500 text-slate-900 font-bold rounded text-xs transition shadow-[0_0_10px_rgba(245,158,11,0.3)]";
            btnConfirm.innerText = "Guardar";
            btnConfirm.onclick = function() {
                handleConfirm(lat, lng);
            };

            btnGroup.appendChild(btnCancel);
            btnGroup.appendChild(btnConfirm);
            container.appendChild(title);
            container.appendChild(btnGroup);

            L.popup({ closeButton: false })
                .setLatLng([lat, lng])
                .setContent(container)
                .openOn(map);
        });

        async function getAddressName(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
                const data = await response.json();
                const addr = data.address;
                if (!addr) return "Ubicación sin nombre";

                const street = addr.road || addr.pedestrian || addr.footway || addr.path;
                const area = addr.suburb || addr.neighbourhood || addr.village || addr.city;
                
                if (street && area) return `${street}, ${area}`;
                if (street) return street;
                if (area) return `${area}`;
                return "Ubicación Marcada";
            } catch (error) {
                return "Ubicación Guardada";
            }
        }

        async function addLocationToSidebar(lat, lng) {
            const listContainer = document.getElementById('dynamic-list-content');
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.style.display = 'none';

            const locationName = await getAddressName(lat, lng);
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newItem = document.createElement('div');
            newItem.className = 'group flex items-start gap-3 p-3 hover:bg-white/10 bg-white/5 rounded-lg cursor-pointer transition animate-[fadeIn_0.5s_ease-out] border border-transparent hover:border-destello-amber/30 mb-2';
            
            newItem.onclick = function() {
                map.flyTo([lat, lng], 18, {
                    animate: true,
                    duration: 1.5
                });
            };

            newItem.innerHTML = `
                <div class="mt-0.5 w-8 h-8 rounded-full bg-destello-blue/20 flex items-center justify-center border border-destello-blue/30 group-hover:bg-destello-blue group-hover:text-white transition shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-destello-blue group-hover:text-white"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                </div>
                <div class="min-w-0 flex-1">
                    <div class="text-xs font-bold text-white truncate leading-tight mb-0.5" title="${locationName}">${locationName}</div>
                    <div class="flex items-center gap-2">
                        <span class="text-[9px] font-mono text-slate-400 bg-slate-800/50 px-1 rounded">${lat.toFixed(4)}, ${lng.toFixed(4)}</span>
                    </div>
                    <div class="text-[9px] text-slate-500 mt-1 flex items-center gap-1">
                        <span class="w-1 h-1 rounded-full bg-green-500"></span> Guardado ${timeString}
                    </div>
                </div>
            `;
            
            listContainer.insertBefore(newItem, listContainer.firstChild);
        }

        function handleConfirm(lat, lng) {
            map.closePopup();
            if (tempMarker) tempMarker.setIcon(createCustomIcon(loadingIconHtml));
            showToast('loading', 'Guardando...');

            fetch('/guardar_punto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lng: lng })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    if (tempMarker) {
                        tempMarker.setIcon(createCustomIcon(savedIconHtml));
                        tempMarker = null; 
                    }
                    showToast('success', 'Ubicación registrada');
                    addLocationToSidebar(lat, lng);
                } else {
                    throw new Error('Error del servidor');
                }
            })
            .catch(error => {
                console.error(error);
                showToast('error', 'Error al guardar.');
                if (tempMarker) tempMarker.setIcon(createCustomIcon(pendingIconHtml));
            });
        }

        const toastEl = document.getElementById('toast');
        const toastIconEl = document.getElementById('toast-icon');
        const toastMsgEl = document.getElementById('toast-message');
        let toastTimeout;

        function showToast(type, message) {
            clearTimeout(toastTimeout);
            if (type === 'loading') {
                toastIconEl.innerHTML = `<svg class="animate-spin h-5 w-5 text-destello-amber" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            } else if (type === 'success') {
                toastIconEl.innerHTML = `<svg class="h-5 w-5 text-green-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
            } else if (type === 'error') {
                toastIconEl.innerHTML = `<svg class="h-5 w-5 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
            }
            toastMsgEl.textContent = message;
            toastEl.classList.remove('translate-y-20', 'opacity-0');
            if (type !== 'loading') {
                toastTimeout = setTimeout(() => toastEl.classList.add('translate-y-20', 'opacity-0'), 3000);
            }
        }
    </script>
</body>
</html>
